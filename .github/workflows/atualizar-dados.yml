name: Atualizar dados da Câmara

on:
  workflow_dispatch:        # botão "Run workflow" manual na aba Actions
  schedule:
    - cron: "0 6 * * 1"     # toda segunda-feira às 06:00 UTC (03:00 em Brasília)

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar coletor
        run: python coletar_dados_camara.py

      - name: Commitar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/*.json
          git diff --staged --quiet || git commit -m "Atualiza dados das votações (automático)"
          git push
